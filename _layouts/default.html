<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root {
      --paper: #fdfaf1;
      --ink: #1a1f33;
      --muted: #5d6275;
      --margin: rgba(224, 64, 69, 0.38);
      --accent: #2b4fa8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #15171f;
        --ink: #ece9e0;
        --muted: #a3a7b6;
        --margin: rgba(255, 128, 128, 0.3);
        --accent: #8fb0ff;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      /* A page of the app: ivory paper with its red margin. */
      background-image: linear-gradient(90deg, transparent 31px, var(--margin) 31px, var(--margin) 32px, transparent 32px);
      color: var(--ink);
      font: 18px/1.6 "New York", ui-serif, Georgia, "Times New Roman", serif;
      overflow-wrap: break-word;
    }
    main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px 48px; }
    header { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
    header img { width: 64px; height: 64px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18); }
    header a { color: inherit; text-decoration: none; font-size: 28px; font-weight: 700; }
    h1 { font-size: 34px; line-height: 1.2; margin: 24px 0 12px; }
    h2 { font-size: 23px; line-height: 1.3; margin: 36px 0 8px; }
    h3 { font-size: 19px; line-height: 1.3; margin: 24px 0 4px; }
    p, ul, ol { margin: 0 0 18px; }
    ul { padding-left: 22px; }
    li { margin: 0 0 8px; }
    a { color: var(--accent); }
    code { font: 15px ui-monospace, Menlo, Consolas, monospace; }
    .lead { font-size: 20px; }
    .small, footer { color: var(--muted); font-size: 15px; }
    footer { margin-top: 48px; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header>
      <a href="./"><img src="icon.png" alt=""></a>
      <a href="./">Inkfold</a>
    </header>
    {{ content }}
    <footer>
      <a href="./">Inkfold Notebooks</a> · <a href="support">Support</a> · <a href="privacy">Privacy</a> · © 2026 Sam Ayers
    </footer>
  </main>
</body>
</html>
